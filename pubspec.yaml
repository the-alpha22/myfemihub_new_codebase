name: bridge_ai
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 6.0.0+27

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: any
  firebase_auth: any
  firebase_core: any
  get: any
  logger: any
  uuid: any
  timeago: any
  firebase_storage: any
  google_fonts: any
  image_picker: any
  firebase_messaging: any
  cached_network_image: any
  flutter_svg: any
  fluttertoast: any
  # location: any
  http: any
  intl: any
  flutter_dotenv: any
  cupertino_icons: any
  flutter_local_notifications: any
  url_launcher: any
  # geolocator: # REMOVED - using manual address entry instead
  # geocoding: # REMOVED - using manual address entry instead
  firebase_dynamic_links: any
  loading_animation_widget: any
  share_plus: any
  flutter_chat_types: any
  google_sign_in: any
  lottie: any
  sign_in_with_apple: any
  phosphoricons_flutter: any
  flutter_animate: any
  pointycastle: any
  cryptography: any
  basic_utils: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/icon.png"
  remove_alpha_ios: true

  flutter_lints: ^1.0.0


flutter:

  uses-material-design: true

  assets:
    - images/
    - assets/.env
    - assets/fonts/Domaine.otf
    - assets/fonts/DomaineDispNar-Black.otf
    - shorebird.yaml